version: 2

models:
  - name: stg_prices
    description: One row per day, station, fuel and self/served mode.
    tests:
      - unique_combination:
          columns: [price_date, station_id, fuel, is_self]
    columns:
      - name: price_date
        tests: [not_null]
      - name: station_id
        tests: [not_null]
      - name: fuel
        tests: [not_null]
      - name: is_self
        tests: [not_null]
      - name: price
        tests:
          - not_null
          - between: {min: 0.5, max: 4}
      - name: province
        tests: [not_null]
