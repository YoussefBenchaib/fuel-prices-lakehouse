name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -v
      - name: Run the pipeline on the sample day
        run: python -m fuel_lakehouse process --raw-dir sample/raw --lake-dir data/lake
      - name: dbt build (models and data tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
